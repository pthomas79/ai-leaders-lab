<title>BSM AI Leaders Lab - Copilot Practice Lab</title>
<meta name="theme-color" content="#00396F">

<style>
@font-face{font-family:'Inter';font-style:normal;font-display:swap;font-weight:100 900;src:url('fonts/inter-latin-wght-normal.woff2') format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#00396F;color:#00203D;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:20px;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:linear-gradient(160deg,#00396F 0%,#00203D 100%)}
.gate{width:100%;max-width:400px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden}
.gate-head{background:#00396F;padding:22px 24px;display:flex;align-items:center;gap:14px;color:#fff}
.logo{font-weight:800;font-size:22px;letter-spacing:.04em;border:2px solid #fff;border-radius:6px;padding:2px 8px}
.gate-head span{font-size:13px;line-height:1.35;opacity:.9}
form{padding:24px}
h1{font-size:20px;font-weight:700;margin-bottom:6px}
p.sub{font-size:14px;color:#4b5563;margin-bottom:18px;line-height:1.45}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid #cbd5e1;border-radius:10px;outline:none;color:#00203D}
input:focus{border-color:#0087CC;box-shadow:0 0 0 3px rgba(0,135,204,.2)}
button{font:inherit;font-size:16px;font-weight:600;padding:12px 20px;border:0;border-radius:10px;background:#00396F;color:#fff;cursor:pointer;min-height:48px}
button:hover{background:#00203D}
button:disabled{opacity:.6;cursor:wait}
#e{min-height:20px;margin-top:10px;font-size:14px;color:#b42318}
#e.busy{color:#4b5563}
</style>
</head>
<body>
<main class="gate">
  <div class="gate-head"><div class="logo" aria-hidden="true">BSM</div><span>AI Leaders Lab<br>Copilot Practice Lab</span></div>
  <form id="f" autocomplete="off">
    <h1>Welcome</h1>
    <p class="sub">Enter the workshop password to open the practice lab.</p>
    <label for="p">Password</label>
    <div class="row">
      <input type="password" id="p" name="p" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
      <button id="b" type="submit">Open</button>
    </div>
    <div id="e" role="status" aria-live="polite"></div>
  </form>
</main>
